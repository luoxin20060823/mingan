<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内容安全审核平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900" x-data="app()" x-init="setDefaultHistoryRange()">
  <main class="mx-auto max-w-7xl px-4 py-5">
    <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-2xl font-semibold">内容安全审核平台</h1>
      <span class="text-sm text-slate-500">Content Audit Platform</span>
    </header>

    <nav class="mb-5 flex flex-wrap gap-2 border-b border-slate-200">
      <template x-for="tab in tabs" :key="tab.id">
        <button class="px-4 py-2 text-sm font-medium"
          :class="currentTab === tab.id ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-600'"
          @click="currentTab = tab.id"
          x-text="tab.label"></button>
      </template>
    </nav>

    <section x-show="error" class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700" x-text="error"></section>

    <section x-show="currentTab === 'single'" class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_420px]">
      <div class="space-y-3">
        <textarea class="h-44 w-full rounded border border-slate-300 p-3" maxlength="2000" x-model="singleText" placeholder="输入待审核中文文本"></textarea>
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-500"><span x-text="singleText.length"></span>/2000</span>
          <button class="rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50" :disabled="loading" @click="auditSingle()">提交审核</button>
        </div>
        <template x-if="singleResult">
          <div class="rounded border bg-white p-4">
            <div class="mb-3 flex flex-wrap gap-2">
              <span class="rounded bg-slate-900 px-2 py-1 text-sm text-white" x-text="singleResult.risk_level"></span>
              <span class="rounded bg-slate-100 px-2 py-1 text-sm" x-text="singleResult.violation_category || '合规'"></span>
              <span class="rounded bg-blue-50 px-2 py-1 text-sm text-blue-700" x-text="'置信度 ' + singleResult.confidence_score"></span>
            </div>
            <div class="mb-3 whitespace-pre-wrap rounded bg-slate-50 p-3 text-sm" x-html="highlightText(singleText, singleResult.hit_details)"></div>
            <p class="text-sm text-slate-700" x-text="singleResult.llm_explanation"></p>
            <dl class="mt-3 grid gap-2 text-sm md:grid-cols-3">
              <div><dt class="text-slate-500">处置动作</dt><dd><span x-text="actionLabel(singleResult.disposal_suggestion.platform_action)"></span><span class="ml-1 text-xs text-slate-400" x-text="'(' + singleResult.disposal_suggestion.platform_action + ')'"></span></dd></div>
              <div><dt class="text-slate-500">用户提示</dt><dd x-text="singleResult.disposal_suggestion.user_message"></dd></div>
              <div><dt class="text-slate-500">审核备注</dt><dd x-text="singleResult.disposal_suggestion.operation_note"></dd></div>
            </dl>
          </div>
        </template>
      </div>
      <div class="space-y-3">
        <div id="radar" class="h-72 rounded border bg-white"></div>
        <template x-if="singleResult">
          <table class="w-full border-collapse bg-white text-sm">
            <thead><tr class="border-b"><th class="p-2 text-left">层级</th><th class="p-2 text-left">分数</th><th class="p-2 text-left">耗时</th></tr></thead>
            <tbody>
              <tr class="border-b"><td class="p-2">L1</td><td class="p-2" x-text="singleResult.l1_score"></td><td class="p-2" x-text="singleResult.processing_time.l1_ms + ' ms'"></td></tr>
              <tr class="border-b"><td class="p-2">L2</td><td class="p-2" x-text="singleResult.l2_score"></td><td class="p-2" x-text="singleResult.processing_time.l2_ms + ' ms'"></td></tr>
              <tr><td class="p-2">L3</td><td class="p-2" x-text="singleResult.l3_score"></td><td class="p-2" x-text="singleResult.processing_time.l3_ms + ' ms'"></td></tr>
            </tbody>
          </table>
        </template>
      </div>
    </section>

    <section x-show="currentTab === 'batch'" class="space-y-4">
      <div class="grid gap-3 lg:grid-cols-[minmax(0,1fr)_260px]">
        <textarea class="h-48 w-full rounded border border-slate-300 p-3" x-model="batchText" placeholder="每行一条，最多 50 条"></textarea>
        <div class="space-y-3">
          <input type="file" accept=".txt,text/plain" class="block w-full text-sm" @change="loadBatchFile($event)" />
          <button class="w-full rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50" :disabled="loading" @click="auditBatch()">批量审核</button>
        </div>
      </div>
      <table class="w-full border-collapse bg-white text-sm" x-show="batchResults.length">
        <thead><tr class="border-b"><th class="p-2 text-left">序号</th><th class="p-2 text-left">原文摘要</th><th class="p-2 text-left">等级</th><th class="p-2 text-left">类别</th><th class="p-2 text-left">置信度</th><th class="p-2 text-left">处置</th><th class="p-2 text-left">操作</th></tr></thead>
        <tbody>
          <template x-for="(row, i) in batchResults" :key="i">
            <tr class="border-b">
              <td class="p-2" x-text="i + 1"></td>
              <td class="p-2" x-text="row.text.length > 50 ? row.text.slice(0, 50) + '...' : row.text"></td>
              <td class="p-2" x-text="row.result.risk_level"></td>
              <td class="p-2" x-text="row.result.violation_category || '合规'"></td>
              <td class="p-2" x-text="row.result.confidence_score"></td>
              <td class="p-2" x-text="actionLabel(row.result.disposal_suggestion.platform_action)"></td>
              <td class="p-2"><button class="text-blue-700" @click="selectedResult = row">查看详情</button></td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>

    <section x-show="currentTab === 'history'" class="space-y-4" x-init="loadHistory()">
      <div class="grid gap-2 md:grid-cols-6">
        <select class="rounded border p-2" x-model="historyFilters.risk_level"><option value="">全部等级</option><template x-for="r in risks"><option x-text="r"></option></template></select>
        <select class="rounded border p-2" x-model="historyFilters.category"><option value="">全部类别</option><template x-for="c in categories"><option x-text="c"></option></template></select>
        <input type="datetime-local" class="rounded border p-2" x-model="historyFilters.start_time" />
        <input type="datetime-local" class="rounded border p-2" x-model="historyFilters.end_time" />
        <button class="rounded bg-blue-600 px-3 py-2 text-white" @click="loadHistory()">查询</button>
        <button class="rounded border px-3 py-2" @click="clearHistoryFilters()">清除筛选</button>
      </div>
      <template x-if="history.total === 0"><p class="text-sm text-slate-500">暂无历史记录</p></template>
      <ul class="divide-y rounded border bg-white">
        <template x-for="item in history.items" :key="item.id">
          <li class="cursor-pointer p-3 text-sm hover:bg-slate-50" @click="selectedResult = historyRowToResult(item)">
            <span x-text="item.created_at"></span> · <strong x-text="item.risk_level"></strong> ·
            <span x-text="item.violation_category || '合规'"></span> · <span x-text="item.confidence_score"></span> ·
            <span x-text="item.text.length > 50 ? item.text.slice(0, 50) + '...' : item.text"></span>
          </li>
        </template>
      </ul>
      <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
        <span class="text-slate-500" x-text="historyPageLabel()"></span>
        <div class="flex gap-2">
          <button class="rounded border px-3 py-1 disabled:opacity-40" :disabled="history.page <= 1" @click="changeHistoryPage(-1)">上一页</button>
          <button class="rounded border px-3 py-1 disabled:opacity-40" :disabled="history.page * history.page_size >= history.total" @click="changeHistoryPage(1)">下一页</button>
        </div>
      </div>
    </section>

    <section x-show="currentTab === 'words'" class="space-y-4" x-init="loadWords()">
      <div class="grid gap-2 md:grid-cols-4">
        <input class="rounded border p-2" x-model="wordForm.word" placeholder="词条文本" />
        <select class="rounded border p-2" x-model="wordForm.category"><template x-for="c in categories"><option x-text="c"></option></template></select>
        <select class="rounded border p-2" x-model="wordForm.level"><template x-for="r in risks"><option x-text="r"></option></template></select>
        <button class="rounded bg-blue-600 px-4 py-2 text-white" @click="createWord()">新增词条</button>
      </div>
      <div class="grid gap-2 md:grid-cols-4">
        <select class="rounded border p-2" x-model="wordFilters.category"><option value="">全部类别</option><template x-for="c in categories"><option x-text="c"></option></template></select>
        <select class="rounded border p-2" x-model="wordFilters.level"><option value="">全部等级</option><template x-for="r in risks"><option x-text="r"></option></template></select>
        <button class="rounded border px-3 py-2" @click="loadWords()">筛选</button>
        <button class="rounded border px-3 py-2" @click="clearWordFilters()">清除筛选</button>
      </div>
      <table class="w-full border-collapse bg-white text-sm">
        <thead><tr class="border-b"><th class="p-2 text-left">词条</th><th class="p-2 text-left">类别</th><th class="p-2 text-left">等级</th><th class="p-2 text-left">来源</th><th class="p-2 text-left">创建时间</th><th class="p-2 text-left">操作</th></tr></thead>
        <tbody>
          <template x-for="word in words.items" :key="word.id">
            <tr class="border-b"><td class="p-2" x-text="word.word"></td><td class="p-2" x-text="word.category"></td><td class="p-2" x-text="word.level"></td><td class="p-2" x-text="word.source"></td><td class="p-2" x-text="word.created_at"></td><td class="p-2"><button class="text-red-600" @click="deleteWord(word.id)">删除</button></td></tr>
          </template>
        </tbody>
      </table>
      <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
        <span class="text-slate-500" x-text="wordPageLabel()"></span>
        <div class="flex gap-2">
          <button class="rounded border px-3 py-1 disabled:opacity-40" :disabled="words.page <= 1" @click="changeWordPage(-1)">上一页</button>
          <button class="rounded border px-3 py-1 disabled:opacity-40" :disabled="words.page * words.page_size >= words.total" @click="changeWordPage(1)">下一页</button>
        </div>
      </div>
    </section>

    <section x-show="currentTab === 'rules'" class="space-y-4" x-init="loadRules()">
      <div class="grid gap-2 md:grid-cols-5">
        <input class="rounded border p-2" x-model="ruleForm.name" placeholder="规则名" />
        <input class="rounded border p-2 md:col-span-2" x-model="ruleForm.pattern" placeholder="正则表达式" />
        <select class="rounded border p-2" x-model="ruleForm.category"><template x-for="c in categories"><option x-text="c"></option></template></select>
        <select class="rounded border p-2" x-model="ruleForm.level"><template x-for="r in risks.filter(x => x !== '合规')"><option x-text="r"></option></template></select>
      </div>
      <div class="flex gap-2">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="ruleForm.enabled" />启用</label>
        <button class="rounded bg-blue-600 px-4 py-2 text-white" @click="createRule()">新增规则</button>
        <button class="rounded border px-3 py-2" @click="loadRules()">刷新</button>
      </div>
      <table class="w-full border-collapse bg-white text-sm">
        <thead><tr class="border-b"><th class="p-2 text-left">规则名</th><th class="p-2 text-left">表达式</th><th class="p-2 text-left">类别</th><th class="p-2 text-left">等级</th><th class="p-2 text-left">来源</th><th class="p-2 text-left">状态</th><th class="p-2 text-left">操作</th></tr></thead>
        <tbody>
          <template x-for="rule in rules.items" :key="rule.id">
            <tr class="border-b"><td class="p-2" x-text="rule.name"></td><td class="p-2 font-mono text-xs" x-text="rule.pattern"></td><td class="p-2" x-text="rule.category"></td><td class="p-2" x-text="rule.level"></td><td class="p-2" x-text="rule.source"></td><td class="p-2" x-text="rule.enabled ? '启用' : '停用'"></td><td class="p-2"><button class="text-red-600 disabled:text-slate-400" :disabled="rule.source === 'builtin'" @click="deleteRule(rule.id)">删除</button></td></tr>
          </template>
        </tbody>
      </table>
    </section>

    <section x-show="currentTab === 'policy'" class="space-y-4" x-init="loadPolicy()">
      <div class="grid gap-3 md:grid-cols-3">
        <label class="text-sm">提示阈值<input class="mt-1 w-full rounded border p-2" type="number" step="0.01" min="0" max="1" x-model.number="policyForm.risk_thresholds.hint" /></label>
        <label class="text-sm">警告阈值<input class="mt-1 w-full rounded border p-2" type="number" step="0.01" min="0" max="1" x-model.number="policyForm.risk_thresholds.warning" /></label>
        <label class="text-sm">违规阈值<input class="mt-1 w-full rounded border p-2" type="number" step="0.01" min="0" max="1" x-model.number="policyForm.risk_thresholds.violation" /></label>
      </div>
      <div class="rounded border bg-white p-3">
        <div class="mb-2 text-sm font-medium">高风险类别</div>
        <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-5">
          <template x-for="category in categories" :key="category">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" :value="category" x-model="policyForm.high_risk_categories" /><span x-text="category"></span></label>
          </template>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="rounded bg-blue-600 px-4 py-2 text-white" @click="savePolicy()">保存策略</button>
        <button class="rounded border px-3 py-2" @click="loadPolicy()">恢复当前配置</button>
      </div>
    </section>
  </main>

  <div x-show="selectedResult" class="fixed inset-0 z-10 bg-black/40 p-4" @click.self="selectedResult = null">
    <div class="mx-auto max-h-[90vh] max-w-4xl overflow-auto rounded bg-white p-5">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-lg font-semibold">审核详情</h2>
        <button class="rounded border px-3 py-1" @click="selectedResult = null">关闭</button>
      </div>
      <template x-if="selectedResult">
        <div class="space-y-3">
          <div class="flex flex-wrap gap-2 text-sm">
            <span class="rounded bg-slate-900 px-2 py-1 text-white" x-text="selectedResult.result.risk_level"></span>
            <span class="rounded bg-slate-100 px-2 py-1" x-text="selectedResult.result.violation_category || '合规'"></span>
            <span class="rounded bg-blue-50 px-2 py-1 text-blue-700" x-text="'置信度 ' + selectedResult.result.confidence_score"></span>
          </div>
          <div class="whitespace-pre-wrap rounded bg-slate-50 p-3 text-sm" x-html="highlightText(selectedResult.text, selectedResult.result.hit_details)"></div>
          <pre class="overflow-auto rounded bg-slate-900 p-3 text-xs text-slate-100" x-text="JSON.stringify(selectedResult.result, null, 2)"></pre>
        </div>
      </template>
    </div>
  </div>

  <script>
    function app() {
      return {
        tabs: [{id:'single', label:'单条审核'}, {id:'batch', label:'批量审核'}, {id:'history', label:'历史记录'}, {id:'words', label:'敏感词管理'}, {id:'rules', label:'规则管理'}, {id:'policy', label:'策略配置'}],
        currentTab: 'single', loading: false, error: '',
        singleText: '', singleResult: null, batchText: '', batchResults: [], selectedResult: null,
        history: {total: 0, page: 1, page_size: 20, items: []}, words: {total: 0, page: 1, page_size: 50, items: []}, rules: {total: 0, items: []},
        categories: ['涉政','暴恐','色情','辱骂','违法广告','诈骗','引流','未成年人风险','低俗','其他'], risks: ['合规','提示','警告','违规'],
        wordForm: {word: '', category: '其他', level: '违规'},
        ruleForm: {name: '', pattern: '', category: '引流', level: '警告', enabled: true},
        policyForm: {risk_thresholds: {hint: 0.2, warning: 0.5, violation: 0.85}, high_risk_categories: ['涉政','暴恐','色情','未成年人风险']},
        wordFilters: {category: '', level: ''},
        historyFilters: {risk_level: '', category: '', start_time: '', end_time: ''},
        async api(path, options = {}) {
          const resp = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...options});
          if (!resp.ok) throw new Error(await this.formatApiError(resp));
          return resp.status === 204 ? null : await resp.json();
        },
        async formatApiError(resp) {
          const text = await resp.text();
          if (!text) return resp.statusText || `HTTP ${resp.status}`;
          try {
            const payload = JSON.parse(text);
            if (payload.error && payload.error.message) {
              const details = Array.isArray(payload.error.details) && payload.error.details.length
                ? '：' + payload.error.details.map(item => item.msg || item.message || String(item)).join('；')
                : '';
              return payload.error.message + details;
            }
            if (payload.detail) return Array.isArray(payload.detail) ? payload.detail.map(item => item.msg || String(item)).join('；') : String(payload.detail);
          } catch (e) {
            return text;
          }
          return text;
        },
        async auditSingle() {
          this.error = '';
          if (!this.singleText.trim() || this.singleText.length > 2000) { this.error = '请输入 1-2000 字文本'; return; }
          this.loading = true;
          try { this.singleResult = await this.api('/audit/text', {method:'POST', body: JSON.stringify({text:this.singleText})}); this.drawRadar(this.singleResult); }
          catch(e) { this.error = e.message; } finally { this.loading = false; }
        },
        async loadBatchFile(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          if (file.size > 1024 * 1024) { this.error = '文件大小不能超过 1 MB'; return; }
          this.batchText = await file.text();
        },
        async auditBatch() {
          this.error = '';
          const texts = this.batchText.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          if (!texts.length) { this.error = '请至少输入一条待审核文本'; return; }
          if (texts.length > 50) { this.error = '单次批量不超过 50 条'; return; }
          if (texts.some(t => t.length > 2000)) { this.error = '单条文本不能超过 2000 字'; return; }
          this.loading = true;
          try { const data = await this.api('/audit/batch', {method:'POST', body: JSON.stringify({texts})}); this.batchResults = data.results.map((result, i) => ({text: texts[i], result})); }
          catch(e) { this.error = e.message; } finally { this.loading = false; }
        },
        async loadHistory(page = this.history.page || 1) {
          this.error = '';
          if (this.historyFilters.start_time && this.historyFilters.end_time && this.historyFilters.start_time > this.historyFilters.end_time) { this.error = '时间区间非法'; return; }
          if (this.historyFilters.start_time && this.historyFilters.end_time && new Date(this.historyFilters.end_time) - new Date(this.historyFilters.start_time) > 90 * 24 * 60 * 60 * 1000) { this.error = '时间区间不能超过 90 天'; return; }
          const q = new URLSearchParams({page: String(page), page_size: String(this.history.page_size || 20)});
          if (this.historyFilters.start_time) q.set('start_time', new Date(this.historyFilters.start_time).toISOString());
          if (this.historyFilters.end_time) q.set('end_time', new Date(this.historyFilters.end_time).toISOString());
          if (this.historyFilters.risk_level) q.set('risk_level', this.historyFilters.risk_level);
          if (this.historyFilters.category) q.set('category', this.historyFilters.category);
          try { this.history = await this.api('/history' + (q.toString() ? '?' + q.toString() : '')); } catch(e) { this.error = e.message; }
        },
        setDefaultHistoryRange() {
          const end = new Date();
          const start = new Date(end.getTime() - 30 * 24 * 60 * 60 * 1000);
          const format = (date) => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
          this.historyFilters.start_time = format(start);
          this.historyFilters.end_time = format(end);
        },
        clearHistoryFilters() { this.historyFilters = {risk_level: '', category: '', start_time: '', end_time: ''}; this.loadHistory(1); },
        changeHistoryPage(delta) { const next = Math.max(1, (this.history.page || 1) + delta); if ((next - 1) * this.history.page_size < this.history.total) this.loadHistory(next); },
        historyPageLabel() { return `第 ${this.history.page || 1} 页 / 共 ${this.history.total || 0} 条`; },
        async loadWords(page = this.words.page || 1) {
          const q = new URLSearchParams({page: String(page), page_size: String(this.words.page_size || 50)});
          if (this.wordFilters.category) q.set('category', this.wordFilters.category);
          if (this.wordFilters.level) q.set('level', this.wordFilters.level);
          try { this.words = await this.api('/words?' + q.toString()); } catch(e) { this.error = e.message; }
        },
        clearWordFilters() { this.wordFilters = {category: '', level: ''}; this.loadWords(1); },
        changeWordPage(delta) { const next = Math.max(1, (this.words.page || 1) + delta); if ((next - 1) * this.words.page_size < this.words.total) this.loadWords(next); },
        wordPageLabel() { return `第 ${this.words.page || 1} 页 / 共 ${this.words.total || 0} 条`; },
        async createWord() {
          this.error = '';
          if (!this.wordForm.word.trim() || this.wordForm.word.length > 64) { this.error = '词条长度需为 1-64 字'; return; }
          try { await this.api('/words', {method:'POST', body: JSON.stringify(this.wordForm)}); this.wordForm.word = ''; await this.loadWords(); } catch(e) { this.error = e.message; }
        },
        async deleteWord(id) { if (!confirm('确认删除该词条？')) return; try { await this.api(`/words/${id}`, {method:'DELETE'}); await this.loadWords(); } catch(e) { this.error = e.message; } },
        async loadRules() { try { this.rules = await this.api('/rules?page_size=100'); } catch(e) { this.error = e.message; } },
        async createRule() {
          this.error = '';
          if (!this.ruleForm.name.trim() || !this.ruleForm.pattern.trim()) { this.error = '规则名和正则表达式不能为空'; return; }
          try { await this.api('/rules', {method:'POST', body: JSON.stringify(this.ruleForm)}); this.ruleForm.name = ''; this.ruleForm.pattern = ''; await this.loadRules(); } catch(e) { this.error = e.message; }
        },
        async deleteRule(id) { if (!confirm('确认删除该规则？')) return; try { await this.api(`/rules/${id}`, {method:'DELETE'}); await this.loadRules(); } catch(e) { this.error = e.message; } },
        async loadPolicy() { try { this.policyForm = await this.api('/policy'); } catch(e) { this.error = e.message; } },
        async savePolicy() {
          this.error = '';
          const t = this.policyForm.risk_thresholds;
          if (!(t.hint >= 0 && t.warning > t.hint && t.violation > t.warning && t.violation <= 1)) { this.error = '阈值需满足 0 <= hint < warning < violation <= 1'; return; }
          if (!this.policyForm.high_risk_categories.length) { this.error = '至少选择一个高风险类别'; return; }
          try { this.policyForm = await this.api('/policy', {method:'PUT', body: JSON.stringify(this.policyForm)}); } catch(e) { this.error = e.message; }
        },
        historyRowToResult(item) {
          return {text: item.text, result: {
            risk_level: item.risk_level, violation_category: item.violation_category, confidence_score: item.confidence_score,
            l1_score: item.l1_score, l2_score: item.l2_score, l3_score: item.l3_score,
            hit_details: JSON.parse(item.hit_details_json || '[]'),
            llm_explanation: item.llm_explanation,
            disposal_suggestion: JSON.parse(item.disposal_suggestion_json || '{}'),
            processing_time: JSON.parse(item.processing_time_json || '{}')
          }};
        },
        escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); },
        actionLabel(action) {
          return ({pass:'放行', hint:'提示', fold:'折叠', manual_review:'人工复核', block:'拦截', delete:'删除'})[action] || action || '未知';
        },
        highlightText(text, hits) {
          const valid = (hits || []).filter(h => Number.isInteger(h.start) && Number.isInteger(h.end) && h.end > h.start).sort((a, b) => a.start - b.start);
          let cursor = 0, html = '';
          for (const hit of valid) {
            if (hit.start < cursor) continue;
            html += this.escapeHtml(text.slice(cursor, hit.start));
            html += `<mark class="rounded bg-yellow-200 px-1" title="${this.escapeHtml(hit.layer + ' / ' + hit.engine + ' / ' + hit.matched_word)}">${this.escapeHtml(text.slice(hit.start, hit.end))}</mark>`;
            cursor = hit.end;
          }
          html += this.escapeHtml(text.slice(cursor));
          return html || this.escapeHtml(text);
        },
        drawRadar(r) {
          setTimeout(() => {
            const el = document.getElementById('radar');
            if (!el || !window.echarts) return;
            echarts.init(el).setOption({radar:{indicator:[{name:'L1',max:1},{name:'L2',max:1},{name:'L3',max:1}]},series:[{type:'radar',data:[{value:[r.l1_score,r.l2_score,r.l3_score]}]}]});
          }, 0);
        }
      }
    }
  </script>
</body>
</html>
